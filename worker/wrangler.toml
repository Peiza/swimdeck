name = "swimdeck-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Private repository where the feedback form creates issues (the token is the secret FEEDBACK_TOKEN).
FEEDBACK_REPO = "Peiza/swimdeck-feedback"

# Comma-separated list of web origins allowed to use the API.
ALLOWED_ORIGINS = "https://peiza.github.io,https://swimdeck.se,https://www.swimdeck.se,http://localhost:8080,http://127.0.0.1:8080"

# Check watched swimmers for new personal bests every hour, a slice of them each time (push notifications).
[triggers]
crons = ["23 * * * *"]

# Per-visitor limit for the routes that write to storage (push and sync).
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 20
  period = 60
