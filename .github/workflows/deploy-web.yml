name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['web/**', 'test/ui/**', 'package.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm test
      - name: Click tests in a browser
        run: |
          npm i --no-save playwright@$(cat test/PLAYWRIGHT_VERSION)
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Build site
        env:
          API_URL: ${{ vars.SWIMDECK_API_URL }}
        run: |
          mkdir _site
          cp -r web/* _site/
          rm -rf _site/test
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(TZ=Europe/Stockholm date +%F)
          printf "export const VERSION = { version: '%s', date: '%s' };\n" "$VERSION" "$DATE" > _site/version.js
          # Cache busting: give every file reference a per-deploy version so
          # browsers fetch the new files right away instead of after the cache expires.
          BUST="${VERSION}-${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(style\.css|app\.js|manifest\.webmanifest)\"#\1=\"\2?v=${BUST}\"#g" _site/index.html
          sed -i -E "s#from '\./([a-z0-9-]+\.js)'#from './\1?v=${BUST}'#g" _site/*.js
          if [ -n "$API_URL" ]; then
            printf "export const CONFIG = { api: %s };\n" "$(node -p 'JSON.stringify(process.env.API_URL)')" > _site/config.js
            # let the Content-Security-Policy allow that API address instead of the default one
            sed -i "s#https://swimdeck-api.peiza.workers.dev#$(node -p 'new URL(process.env.API_URL).origin')#" _site/index.html
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
