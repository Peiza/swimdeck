name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['web/**', 'package.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Build site
        env:
          API_URL: ${{ vars.SWIMDECK_API_URL }}
        run: |
          mkdir _site
          cp -r web/* _site/
          rm -rf _site/test
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(TZ=Europe/Stockholm date +%F)
          printf "export const VERSION = { version: '%s', date: '%s' };\n" "$VERSION" "$DATE" > _site/version.js
          if [ -n "$API_URL" ]; then
            printf "export const CONFIG = { api: %s };\n" "$(node -p 'JSON.stringify(process.env.API_URL)')" > _site/config.js
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
