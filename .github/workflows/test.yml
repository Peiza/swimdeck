name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Click tests in a browser
        run: |
          npm i --no-save playwright@$(cat test/PLAYWRIGHT_VERSION)
          npx playwright install --with-deps chromium
          npm run test:ui
