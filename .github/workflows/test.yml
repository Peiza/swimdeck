name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Click tests in a browser
        run: |
          npm i --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          npm run test:ui
